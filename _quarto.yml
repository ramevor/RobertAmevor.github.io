project:
  type: website
  output-dir: docs

# ============================================================
# SITE METADATA
# ============================================================

description-meta: "Robert Amevor — PhD Student in Biostatistics at the University of South Carolina"
author-meta: "Robert Amevor"

# ============================================================
# WEBSITE
# ============================================================

website:
  title: "Robert Amevor"
  image: "files/images/mypic.jpg"
  description: "Academic website of Robert Amevor, PhD student in Biostatistics at the University of South Carolina."

  # ----------------------------------------------------------
  # NAVIGATION
  # ----------------------------------------------------------

  navbar:
    background: light

    left:

      - text: Home
        href: index.qmd

      - text: Research
        menu:
          - text: Publications
            href: publications.qmd
          - text: Projects
            href: projects.qmd

      - text: Teaching
        href: teaching.qmd

      - text: News
        href: posts.qmd

      - text: Contact
        href: contact.qmd

    right:

      - text: CV
        href: files/Robert_Amevor_CV.pdf
        target: _blank

      - icon: github
        href: https://github.com/ramevor
        target: _blank

      - text: Google Scholar
        href: https://scholar.google.com/citations?user=bs2MgcwAAAAJ&hl=en
        target: _blank

      - text: ResearchGate
        href: https://www.researchgate.net/profile/Robert-Amevor
        target: _blank

      - icon: linkedin
        href: https://www.linkedin.com/in/robert-amevor-msc-gstat-81556b1b7/
        target: _blank

  page-navigation: true

  # ----------------------------------------------------------
  # FOOTER
  # ----------------------------------------------------------

  page-footer:
    left: "© Robert Amevor <script>document.write(new Date().getFullYear())</script>"

    center: "Academic website of Robert Amevor"

    right:
      - icon: github
        href: https://github.com/ramevor
        target: _blank

      - text: Google Scholar
        href: https://scholar.google.com/citations?user=bs2MgcwAAAAJ&hl=en
        target: _blank

      - text: ResearchGate
        href: https://www.researchgate.net/profile/Robert-Amevor
        target: _blank

  # ----------------------------------------------------------
  # SEARCH
  # ----------------------------------------------------------

  search:
    location: navbar
    type: textbox

  reader-mode: true

  draft-mode: unlinked

  # ----------------------------------------------------------
  # GITHUB REPOSITORY
  # ----------------------------------------------------------

  repo-url: https://github.com/ramevor/RobertAmevor.github.io

  # ----------------------------------------------------------
  # SOCIAL / SHARING METADATA
  # ----------------------------------------------------------

  open-graph: true

  twitter-card: true

  # Assuming GitHub Pages is served at ramevor.github.io
  site-url: "https://ramevor.github.io"

# ============================================================
# BIBLIOGRAPHY
# ============================================================

bibliography: references.bib

# ============================================================
# HTML FORMAT
# ============================================================

format:
  html:

    theme: cosmo

    css:
      - styles.css
      - custom.css

    toc: true

    footnotes-hover: true

    code-copy: true

    code-link: true

    code-overflow: wrap

    fig-align: center

    link-external-icon: false

    link-external-newwindow: true

    email-obfuscation: javascript

    link-external-filter: '^(?:http:|https:)\/\/ramevor\.github\.io'

    include-in-header: "files/includes/_academic.qmd"